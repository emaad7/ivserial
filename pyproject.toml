[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ivserial"
version = "1.0.0"
description = "Exact symbolic tests of serial independence (information variance)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Emad Ashtari Nezhad", email = "emaad7@gmail.com"}]
dependencies = ["numpy>=1.20", "scipy>=1.7"]
keywords = ["serial independence", "time series", "permutation test", "information variance", "entropy", "nonparametric"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
excel = ["pandas", "openpyxl"]

[project.scripts]
ivserial = "ivserial.cli:main"

[project.gui-scripts]
ivserial-gui = "ivserial.gui:main"

[tool.setuptools]
packages = ["ivserial"]

[tool.setuptools.package-data]
ivserial = ["GUIDE.html"]
